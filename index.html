<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESTARA Business Manager</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M2 92 46 8v33L28 68z' fill='%23C9D1DE'/%3E%3Cpath d='M50 8 98 92 38 78 70 60 52 42z' fill='%237C8AA8'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#070C18;--s1:#0E1628;--s2:#16213A;--ln:#243252;--tx:#E8ECF4;--mu:#8D9AB5;--sv:#C9D1DE;--ac:#9DB4E6;--ok:#6FD1A0;--wr:#F2B66B;--bad:#F08080;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;background:var(--bg);color:var(--tx);font:400 15px/1.45 Outfit,system-ui,sans-serif;max-width:760px;margin:auto}
#app{height:100%;display:flex;flex-direction:column}[hidden]{display:none!important}
header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--ln)}
header b{letter-spacing:.32em;font-weight:500}header small{color:var(--mu);margin-left:auto}
main{flex:1;overflow:auto;padding:18px}
nav{display:flex;overflow-x:auto;border-top:1px solid var(--ln);background:var(--s1);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:12px 14px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--tx);box-shadow:inset 0 2px var(--ac)}
h2{font-weight:500;font-size:22px;margin-bottom:14px}h3{font-weight:500;font-size:15px;color:var(--sv);margin:20px 0 8px}
.hero{background:linear-gradient(135deg,var(--s2),var(--s1));border:1px solid var(--ln);border-radius:16px;padding:22px}
.big{font-size:38px;font-weight:300}.big.sm{font-size:26px}.mu{color:var(--mu)}.up{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--wr)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:14px}
.li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}.li:last-child{border:0}
.rowbtn{width:100%;background:none;border:0;border-bottom:1px solid var(--ln);color:var(--tx);font:inherit;text-align:left;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.p{background:var(--s1);border:1px solid var(--ln);border-radius:10px;padding:12px;text-align:left;color:var(--tx);font:inherit;cursor:pointer}.p:disabled{opacity:.4}.p b{display:block;font-weight:500}
input,select{width:100%;background:var(--s2);border:1px solid var(--ln);border-radius:8px;color:var(--tx);padding:10px 12px;font:inherit;margin:4px 0 10px}
input:focus,button:focus-visible,select:focus{outline:2px solid var(--ac);outline-offset:1px}
.btn{display:block;background:var(--sv);color:#0A1020;border:0;border-radius:10px;padding:12px 16px;font:500 15px Outfit,sans-serif;cursor:pointer;width:100%;margin-top:8px}
.btn.g{background:var(--s2);color:var(--tx);border:1px solid var(--ln)}.btn:disabled{opacity:.4}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px 0}
.chip{background:var(--s1);border:1px solid var(--ln);color:var(--mu);border-radius:20px;padding:6px 14px;font:inherit;white-space:nowrap;cursor:pointer}.chip.on{color:var(--tx);border-color:var(--ac)}
.cart{position:sticky;bottom:0;background:var(--s2);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-top:16px}
.q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--ln);background:var(--s1);color:var(--tx);cursor:pointer}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--s1);border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-width:760px;max-height:90%;overflow:auto}
pre{background:#F4F6FA;color:#14203A;border-radius:8px;padding:16px;font:13px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap}
#auth{max-width:380px;margin:0 auto;padding:12vh 20px}#auth h1{letter-spacing:.35em;font-weight:500;text-align:center;margin:12px 0 24px}#err{color:var(--bad);min-height:20px}
@media print{body>*:not(#md){display:none!important}#md{position:static;background:none}.sheet{padding:0}.sheet button,.sheet h2{display:none}}
</style></head><body>
<section id="auth" hidden>
<svg width="56" height="50" viewBox="0 0 100 90" style="display:block;margin:auto"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F7FC"/><stop offset="1" stop-color="#7C8AA8"/></linearGradient></defs><path d="M2 88 46 6v33L28 66z" fill="url(#g)"/><path d="M50 6 98 88 38 76 70 58 52 40z" fill="#AEB9CE"/></svg>
<h1>ESTARA</h1><p class="mu" style="text-align:center;margin:-12px 0 20px">Business Manager untuk UMKM</p>
<input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password (min. 6 karakter)" autocomplete="current-password">
<p id="err"></p><button class="btn" data-a="login">Masuk</button><button class="btn g" data-a="register">Daftar akun baru</button><button class="btn g" data-a="google">Masuk dengan Google</button></section>
<div id="app" hidden><header><svg width="28" height="25" viewBox="0 0 100 90"><path d="M2 88 46 6v33L28 66z" fill="#E4E9F2"/><path d="M50 6 98 88 38 76 70 58 52 40z" fill="#AEB9CE"/></svg><b>ESTARA</b><small id="shop"></small></header><main id="m"></main><nav id="nav"></nav></div>
<script type="module" src="main.js"></script>
</body></html>
